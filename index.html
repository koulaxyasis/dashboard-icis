<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1A">
<title>Adventurer Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="game-state.js"></script>
<script src="quest-library.js"></script>
<script src="career-data.js"></script>
<script src="quest-engine.js"></script>
<script src="hero-art.js"></script>
<script src="ui-kit.js"></script>
<script src="quest-ui.js"></script>
<script src="nova.js"></script>
<style>
/* ---- hero banner ---- */
.banner { padding:18px; border-color:rgba(233,190,110,.22);
  background:radial-gradient(circle at 90% 0%, rgba(233,190,110,.13), transparent 58%), var(--panel); }
.banner-row { display:flex; gap:16px; align-items:center; }
.banner-id { flex:1; min-width:0; }
.banner-name { font-size:24px; font-weight:700; color:var(--text); letter-spacing:-.025em; margin:2px 0 0; }
.banner-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:6px; }
.banner-xp { margin-top:14px; }
.xp-line { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px; }
.xp-k { font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--text-3); }
.xp-n { font-family:var(--mono); font-size:11px; color:var(--text-2); }

/* ---- main story ---- */
.story { padding:17px; border-color:rgba(233,190,110,.26); }
.story-t { font-size:18px; font-weight:700; color:var(--text); margin:5px 0 3px; letter-spacing:-.015em; }
.story-cta { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

/* quest card styles now live in quest-ui.js, shared with the Quest Board */

/* ---- contracts ---- */
.ct { display:flex; align-items:center; gap:11px; padding:11px 13px; margin-bottom:7px; }
.ct.done { border-color:rgba(107,227,164,.26); }
.ct-b { flex:1; min-width:0; }
.ct-t { font-size:12.5px; font-weight:600; color:var(--text); }
.ct.done .ct-t { color:var(--ok); }
.ct-s { font-size:10.5px; color:var(--text-3); margin-top:2px; }
.ct-n { flex:none; font-family:var(--mono); font-size:11px; color:var(--text-3); }

/* ---- world map ---- */
.world { display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:10px; }
.loc { display:block; padding:15px 14px; text-decoration:none; transition:transform .16s, border-color .16s; }
.loc:hover { transform:translateY(-2px); }
.loc-ic { margin-bottom:9px; }
.loc-l { font-size:13.5px; font-weight:700; color:var(--text); letter-spacing:-.01em; }
.loc-p { font-size:10.5px; color:var(--text-3); margin-top:2px; }
.loc-v { font-family:var(--mono); font-size:10.5px; margin-top:7px; }

.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:760px){ .two{ grid-template-columns:1fr; } }

.mini { padding:14px; }
.mini-t { font-size:13px; font-weight:650; color:var(--text); }
.mini-s { font-size:11.5px; color:var(--text-3); margin-top:3px; }

/* settings modal (kept from the original hub) */
.modal-bg { position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center;
  padding:18px; background:rgba(0,0,0,.65); backdrop-filter:blur(10px); }
.modal-bg.show { display:flex; }
.modal { width:100%; max-width:440px; max-height:88vh; overflow-y:auto; background:#0F1322;
  border:1px solid var(--line-2); border-radius:var(--r-lg); padding:20px; }
.modal-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.modal-x { border:0; background:transparent; color:var(--text-3); cursor:pointer; padding:2px; line-height:0; }
.fieldrow { display:flex; gap:8px; align-items:center; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:none; }
.seg button { border:0; background:transparent; color:var(--text-3); font:inherit; font-size:12px; font-weight:600; padding:9px 12px; cursor:pointer; }
.seg button.on { background:rgba(255,255,255,.12); color:var(--text); }
.field { margin-bottom:13px; }
</style>
</head>
<body data-icis>
<div class="wrap">

  <!-- 1,2 — portrait, identity, shared XP bar -->
  <section class="card ornate banner">
    <div class="banner-row">
      <a href="character.html" id="portrait" aria-label="Hero profile"></a>
      <div class="banner-id">
        <span class="lore" id="bTitle">Adventurer</span>
        <h1 class="banner-name" id="bName">Icis</h1>
        <div class="banner-meta" id="bMeta"></div>
      </div>
    </div>
    <div class="banner-xp">
      <div class="xp-line">
        <span class="xp-k" id="bNext">Experience</span>
        <span class="xp-n" id="bXp">0 / 100</span>
      </div>
      <div class="track"><div class="fill" id="bFill"></div></div>
    </div>
  </section>

  <!-- 9 — Nova -->
  <div id="novaMount" style="margin-top:10px"></div>

  <!-- 3,4 — Main Story + Continue Quest -->
  <div class="sec"><span class="sec-t">Main Story</span><span class="sec-m" id="storyMeta"></span></div>
  <section class="card ornate story" id="story"></section>

  <!-- 5 — the five automated daily quests, then the ones you write -->
  <div id="dailyQuests"></div>
  <div id="myQuests"></div>

  <div class="two" style="margin-top:22px">
    <div>
      <!-- 6 — weekly contracts -->
      <div class="sec" style="margin-top:0"><span class="sec-t">Guild Contracts</span><span class="sec-m" id="ctMeta"></span></div>
      <div id="contracts"></div>
    </div>
    <div>
      <!-- 7 — career campaign progress -->
      <div class="sec" style="margin-top:0"><span class="sec-t">Career Campaign</span><span class="sec-m" id="campMeta"></span></div>
      <a class="card mini" href="career.html" style="display:block;text-decoration:none" id="camp"></a>

      <!-- 8 — upcoming social plan -->
      <div class="sec"><span class="sec-t">Tavern</span><span class="sec-m">next plan</span></div>
      <a class="card mini" href="tavern.html" style="display:block;text-decoration:none" id="social"></a>

      <!-- 10 — recent reward -->
      <div class="sec"><span class="sec-t">Latest Reward</span><span class="sec-m" id="rewMeta"></span></div>
      <a class="card mini" href="character.html?tab=achievements" style="display:block;text-decoration:none" id="reward"></a>
    </div>
  </div>

  <!-- 11 — world locations -->
  <div class="sec">
    <span class="sec-t">World</span>
    <button class="btn sm" id="openSettings">Your Data</button>
  </div>
  <div class="world" id="world"></div>

</div>

<!-- Your Data — unchanged behaviour, still writes into po_water_v1.profile -->
<div class="modal-bg" id="settingsBg">
  <div class="modal" role="dialog" aria-label="Your data">
    <div class="modal-h">
      <span style="font-size:16px;font-weight:700;color:var(--text)">Your Data</span>
      <button class="modal-x" id="settingsClose" aria-label="Close">✕</button>
    </div>
    <div class="field"><label class="fl">Height</label>
      <div class="fieldrow">
        <input id="heightA" type="number" min="0" inputmode="decimal" placeholder="cm">
        <input id="heightB" type="number" min="0" inputmode="decimal" placeholder="in" style="display:none">
        <div class="seg" id="heightUnitSeg"><button data-u="cm" class="on">cm</button><button data-u="ft">ft/in</button></div>
      </div></div>
    <div class="field"><label class="fl">Weight</label>
      <div class="fieldrow">
        <input id="weight" type="number" min="0" inputmode="decimal" placeholder="weight">
        <div class="seg" id="weightUnitSeg"><button data-u="kg" class="on">kg</button><button data-u="lb">lb</button></div>
      </div></div>
    <div class="field"><label class="fl">Age</label><input id="age" type="number" min="0" inputmode="numeric" placeholder="years"></div>
    <div class="field"><label class="fl">Sex</label>
      <div class="seg" id="sexSeg" style="display:flex;width:100%">
        <button data-s="m" style="flex:1">Male</button><button data-s="f" style="flex:1">Female</button>
      </div></div>
    <div class="field"><label class="fl">Active hours / week</label><input id="activity" type="number" min="0" inputmode="decimal" placeholder="e.g. 5"></div>
    <button class="btn gold" id="settingsSave" style="width:100%">Save</button>
    <div id="settingsStatus" class="sub" style="text-align:center;min-height:16px;margin-top:8px"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var GS = window.GameState, QE = window.QuestEngine, CD = window.CareerData,
      UI = window.UI, HA = window.HeroArt;
  var $ = function (id) { return document.getElementById(id); };

  var st = document.createElement('style'); st.textContent = HA.CSS; document.head.appendChild(st);

  /* ---------- banner ---------- */
  function renderBanner() {
    var t = GS.totals(), s = GS.get();
    var st = GS.streakInfo();
    $('portrait').innerHTML = HA.fromState(s, 84);
    $('bName').textContent = t.name;
    $('bTitle').textContent = t.title || 'Adventurer';
    $('bMeta').innerHTML =
      UI.rankBadge(t.rank) +
      '<span class="chip on">' + UI.esc(t.rank.name) + '</span>' +
      '<span class="chip">' + UI.esc(t.className) + '</span>' +
      '<span class="chip">Score ' + UI.fmt(t.score) + '</span>' +
      '<span class="chip' + (st.count ? ' ok' : '') + '">' + st.count + '-day streak</span>' +
      '<span class="chip' + (st.shields ? ' on' : '') + '" title="One shield is spent automatically to cover a day that would otherwise break your streak. Earned every ' +
        st.every + ' days, up to ' + st.maxShields + '.">' +
        st.shields + '/' + st.maxShields + ' shields</span>' +
      (st.isRestToday ? '<span class="chip ok">rest day</span>' : '');
    $('bXp').textContent = UI.fmt(t.into) + ' / ' + UI.fmt(t.need);
    $('bFill').style.width = (t.pct * 100).toFixed(1) + '%';
    $('bNext').textContent = t.nextRank
      ? 'Level ' + t.level + ' · next rank ' + t.nextRank.name + ' at ' + t.nextRank.at
      : 'Level ' + t.level + ' · maximum rank';
  }

  /* ---------- main story ---------- */
  function renderStory() {
    var s = GS.get();
    var m = CD.currentMission(s);
    var qv = QE.todayView();
    var mainQ = qv.list.filter(function (q) { return q.slot === 'main'; })[0];
    var dl = m.progress.deadline;
    var days = dl ? GS.daysBetween(GS.todayKey(), dl) : null;

    $('story').innerHTML =
      '<span class="lore">Chapter ' + m.chapter.n + ' · ' + UI.esc(m.chapter.lore) + '</span>' +
      '<div class="story-t">' + UI.esc(m.milestone ? m.milestone.name : m.chapter.name) + '</div>' +
      '<div class="sub">' + UI.esc(m.chapter.name) + ' — ' + UI.esc(m.chapter.objective) + '</div>' +
      '<div style="margin-top:12px">' + UI.bar(m.progress.pct / 100) + '</div>' +
      '<div class="banner-meta" style="margin-top:10px">' +
        '<span class="chip on">' + m.progress.pct + '% complete</span>' +
        (days != null ? '<span class="chip ' + (days < 0 ? 'bad' : days <= 3 ? 'on' : '') + '">' +
          (days < 0 ? 'overdue' : 'due in ' + days + 'd') + '</span>' : '') +
        (mainQ ? '<span class="chip' + (mainQ.done ? ' ok' : '') + '">today: ' + UI.esc(mainQ.practicalTitle) + '</span>' : '') +
      '</div>' +
      '<div class="story-cta">' +
        '<a class="btn gold" href="career.html">Continue Quest ' + UI.icon('arrow', 15) + '</a>' +
        '<a class="btn" href="guild.html">Projects</a>' +
      '</div>';
    $('storyMeta').textContent = m.chapter.name;
  }

  /* ---------- daily quests ---------- */
  /* ---------- contracts ---------- */
  function renderContracts() {
    var c = QE.contracts();
    $('contracts').innerHTML = c.list.map(function (x) {
      return '<div class="card ct' + (x.complete ? ' done' : '') + '">' +
        '<span style="color:' + (x.complete ? 'var(--ok)' : 'var(--text-3)') + '">' +
          UI.icon(x.complete ? 'check' : 'clock', 15) + '</span>' +
        '<div class="ct-b">' +
          '<div class="ct-t">' + UI.esc(x.name) + '</div>' +
          '<div class="ct-s">' + UI.esc(x.lore) + ' · +' + x.xp + ' XP</div>' +
          '<div style="margin-top:6px">' + UI.bar(x.pct) + '</div>' +
        '</div>' +
        '<span class="ct-n">' + Math.min(x.have, x.need) + '/' + x.need + '</span>' +
      '</div>';
    }).join('');
    $('ctMeta').textContent = c.done + ' / ' + c.total + ' this week';
  }

  /* ---------- side cards ---------- */
  function renderSide() {
    var s = GS.get(), t = GS.totals();

    var done = CD.CHAPTERS.filter(function (ch) { return CD.chapterProgress(s, ch).complete; }).length;
    var m = CD.currentMission(s);
    $('camp').innerHTML =
      '<div class="mini-t">' + UI.esc(m.chapter.name) + '</div>' +
      '<div class="mini-s">Chapter ' + m.chapter.n + ' of 10 · Career LV ' + t.byId.career.level + '</div>' +
      '<div style="margin-top:9px">' + UI.bar(done / CD.CHAPTERS.length) + '</div>' +
      '<div class="mini-s" style="margin-top:6px">' + done + ' chapters complete</div>';
    $('campMeta').textContent = done + '/10';

    var plans = (s.social.plans || []).filter(function (p) { return !p.done && p.date >= GS.todayKey(); })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var next = plans[0];
    $('social').innerHTML = next
      ? '<div class="mini-t">' + UI.esc(next.title) + '</div>' +
        '<div class="mini-s">' + (next.who ? UI.esc(next.who) + ' · ' : '') +
        (GS.daysBetween(GS.todayKey(), next.date) === 0 ? 'today' : 'in ' + GS.daysBetween(GS.todayKey(), next.date) + ' day' + (GS.daysBetween(GS.todayKey(), next.date) === 1 ? '' : 's')) + '</div>'
      : '<div class="mini-t">No plans yet</div><div class="mini-s">Adding one makes it far more likely to happen.</div>';

    var chron = GS.chronicle(1)[0];
    var titles = s.player.unlockedTitles || [];
    $('reward').innerHTML = titles.length
      ? '<div class="mini-t">Title · ' + UI.esc(titles[titles.length - 1]) + '</div>' +
        '<div class="mini-s">' + (chron ? UI.esc(chron.text) + ' · +' + chron.xp + ' XP' : 'Unlocked from the campaign') + '</div>'
      : (chron
        ? '<div class="mini-t">' + UI.esc(chron.text) + '</div><div class="mini-s">+' + chron.xp + ' XP · ' + UI.ago(chron.at) + ' ago</div>'
        : '<div class="mini-t">Nothing yet</div><div class="mini-s">Complete a quest to start the Chronicle.</div>');
    $('rewMeta').textContent = titles.length ? titles.length + ' titles' : '';
  }

  /* ---------- world ---------- */
  function renderWorld() {
    var t = GS.totals();
    var stat = {
      quest: function () { var v = QE.todayView(); return v.done + '/' + v.total + ' quests'; },
      career: function () { return 'LV ' + t.byId.career.level; },
      guild: function () { return 'LV ' + t.byId.arcana.level; },
      training: function () { return 'LV ' + t.byId.might.level; },
      spring: function () { return 'LV ' + t.byId.vitality.level; },
      treasury: function () { return 'LV ' + t.byId.fortune.level; },
      tavern: function () { return 'LV ' + t.byId.fellowship.level; },
      alchemy: function () { return 'tracker'; },
      hero: function () { return 'LV ' + t.level; },
      spirit: function () { return 'companion'; }
    };
    $('world').innerHTML = UI.WORLD.filter(function (w) { return w.key !== 'hub'; }).map(function (w) {
      return '<a class="card loc" href="' + w.href + '" style="border-color:' + w.color + '26">' +
        '<div class="loc-ic" style="color:' + w.color + '">' + UI.icon(w.icon, 22) + '</div>' +
        '<div class="loc-l">' + UI.esc(w.lore) + '</div>' +
        '<div class="loc-p">' + UI.esc(w.practical) + '</div>' +
        '<div class="loc-v" style="color:' + w.color + '">' + (stat[w.key] ? stat[w.key]() : '') + '</div>' +
      '</a>';
    }).join('');
  }

  function renderAll() {
    renderBanner(); renderStory();
    if (daily) daily.redraw();
    if (mine) mine.redraw();
    renderContracts(); renderSide(); renderWorld();
  }

  /* ---------- interactions ---------- */
  // The daily board and the personal list are mounted from quest-ui.js so
  // the Hub and the Quest Board stay identical. Both call back here to
  // refresh the banner, contracts and side cards after a change.
  var daily = window.QuestUI.mountDaily('dailyQuests', { onChange: afterQuestChange });
  var mine  = window.QuestUI.mountPersonal('myQuests', { onChange: afterQuestChange });

  function afterQuestChange() {
    GS.reconcile();
    renderBanner(); renderContracts(); renderSide(); renderWorld();
  }

  /* ---------- Your Data modal (preserved) ---------- */
  var WATER_KEY = 'po_water_v1';
  var heightUnit = 'cm', weightUnit = 'kg', sex = 'm';
  function defaultWater() {
    return { unit:'bottle', bottleMl:500, glassMl:250, weightUnit:'kg',
      profile:{ weightKg:75, age:25, sex:'m', activityHrsPerWeek:5 },
      caffeineMgPerDay:200, substances:[], logs:{} };
  }
  function setHeightUnit(u) {
    heightUnit = u;
    Array.prototype.forEach.call($('heightUnitSeg').children, function (b) { b.classList.toggle('on', b.dataset.u === u); });
    $('heightB').style.display = u === 'cm' ? 'none' : '';
    $('heightA').placeholder = u === 'cm' ? 'cm' : 'ft';
  }
  function setWeightUnit(u) {
    weightUnit = u;
    Array.prototype.forEach.call($('weightUnitSeg').children, function (b) { b.classList.toggle('on', b.dataset.u === u); });
  }
  function setSex(v) {
    sex = v;
    Array.prototype.forEach.call($('sexSeg').children, function (b) { b.classList.toggle('on', b.dataset.s === v); });
  }
  function getHeightCm() {
    if (heightUnit === 'cm') { var v = parseFloat($('heightA').value); return v > 0 ? v : null; }
    var cm = (parseFloat($('heightA').value) || 0) * 30.48 + (parseFloat($('heightB').value) || 0) * 2.54;
    return cm > 0 ? Math.round(cm) : null;
  }
  function populate() {
    var w = GS.readJSON(WATER_KEY, defaultWater()), p = w.profile || {};
    setWeightUnit(w.weightUnit === 'lb' ? 'lb' : 'kg');
    setHeightUnit(p.heightUnit === 'ft' ? 'ft' : 'cm');
    setSex(p.sex === 'f' ? 'f' : 'm');
    if (p.heightCm) {
      if (heightUnit === 'cm') $('heightA').value = Math.round(p.heightCm);
      else { var ti = p.heightCm / 2.54; $('heightA').value = Math.floor(ti / 12); $('heightB').value = Math.round(ti % 12); }
    }
    $('weight').value = p.weightKg ? (weightUnit === 'lb' ? Math.round(p.weightKg * 2.20462) : Math.round(p.weightKg)) : '';
    $('age').value = p.age || '';
    $('activity').value = p.activityHrsPerWeek != null ? p.activityHrsPerWeek : '';
  }
  $('openSettings').addEventListener('click', function () { populate(); $('settingsBg').classList.add('show'); });
  $('settingsClose').addEventListener('click', function () { $('settingsBg').classList.remove('show'); });
  $('settingsBg').addEventListener('click', function (e) { if (e.target === $('settingsBg')) $('settingsBg').classList.remove('show'); });
  Array.prototype.forEach.call($('heightUnitSeg').children, function (b) {
    b.addEventListener('click', function () { var cm = getHeightCm(); setHeightUnit(b.dataset.u);
      if (cm) { if (heightUnit === 'cm') $('heightA').value = Math.round(cm);
        else { var ti = cm / 2.54; $('heightA').value = Math.floor(ti / 12); $('heightB').value = Math.round(ti % 12); } } });
  });
  Array.prototype.forEach.call($('weightUnitSeg').children, function (b) {
    b.addEventListener('click', function () {
      var v = parseFloat($('weight').value);
      var kg = v > 0 ? (weightUnit === 'lb' ? v / 2.20462 : v) : null;
      setWeightUnit(b.dataset.u);
      if (kg) $('weight').value = weightUnit === 'lb' ? Math.round(kg * 2.20462) : Math.round(kg);
    });
  });
  Array.prototype.forEach.call($('sexSeg').children, function (b) {
    b.addEventListener('click', function () { setSex(b.dataset.s); });
  });
  $('settingsSave').addEventListener('click', function () {
    var w = GS.readJSON(WATER_KEY, defaultWater());
    w.profile = w.profile || {};
    var cm = getHeightCm();
    if (cm) { w.profile.heightCm = cm; w.profile.heightUnit = heightUnit; }
    var wv = parseFloat($('weight').value);
    if (wv > 0) { w.profile.weightKg = weightUnit === 'lb' ? +(wv / 2.20462).toFixed(1) : wv; w.weightUnit = weightUnit; }
    var age = parseInt($('age').value, 10); if (age > 0) w.profile.age = age;
    w.profile.sex = sex;
    var act = parseFloat($('activity').value); if (act >= 0 && !isNaN(act)) w.profile.activityHrsPerWeek = act;
    GS.writeJSON(WATER_KEY, w);
    GS.reconcile();
    $('settingsStatus').textContent = 'Saved ✓';
    setTimeout(function () { $('settingsStatus').textContent = ''; }, 1600);
    renderAll();
  });

  /* ---------- boot ---------- */
  renderAll();
  if (window.Nova) window.Nova.mount('novaMount', { respectDismiss: true });
  document.addEventListener('icis:update', renderBanner);

  document.addEventListener('DOMContentLoaded', function () {
    if (typeof initCloudSync !== 'function') return;
    initCloudSync({
      appKey: 'icis',
      syncedKeys: [GS.KEY],
      onApplied: function () { GS.onRemoteApplied(); renderAll(); }
    });
  });
})();
</script>
</body>
</html>
