  }

  // Re-rendering replaces the log inputs; carry anything half-typed
  // (and the focus) across so a tick elsewhere never eats it.
  function keepInputs(fn) {
    var vals = {}, a = document.activeElement;
    var focus = a && a.getAttribute ? a.getAttribute('data-keep') : null;
    Array.prototype.forEach.call(document.querySelectorAll('[data-keep]'), function (el) {
      if (el.value !== '') vals[el.getAttribute('data-keep')] = el.value;
    });
    fn();
    Object.keys(vals).forEach(function (k) {
      var el = document.querySelector('[data-keep="' + k + '"]');
      if (el) el.value = vals[k];
    });
    if (focus) { var f = document.querySelector('[data-keep="' + focus + '"]'); if (f) f.focus(); }
  }

  function render() {
    if (PC.roll(state)) persist();
    keepInputs(function () {
      var exam = examOn();
      $('blkSplit').hidden = exam;
      $('blkLines').hidden = exam;
      $('blkRoadmap').hidden = exam;
      $('blkReview').hidden = exam && !reviewOpen;
      renderTop();
      renderToday();
      renderBoard();
      if (!exam) { renderSplit(); renderLines(); renderRoadmap(); }
      renderReview();
      renderHistory();
    });
  }

  // ---------------------------------------------------------------
  // Modal
  // ---------------------------------------------------------------
  var modalCtx = null;
  function head(title) {
    return '<div class="modal-h"><span class="modal-t">' + esc(title) + '</span>' +
      '<button class="modal-x" data-act="m-close" aria-label="Close">' + ic('close', 18) + '</button></div>';
  }
  function field(label, inner, forId) {
    return '<div class="field"><label class="fl"' + (forId ? ' for="' + forId + '"' : '') + '>' + label + '</label>' + inner + '</div>';
  }
  function openModal(html, ctx, onMount) {
    modalCtx = ctx || {};
    $('modal').innerHTML = html;
    $('modalBg').classList.add('show');
    document.body.classList.add('pl-lock');
    if (onMount) onMount();
    // Desktop only: focusing on a phone throws the keyboard up uninvited.
    if (window.matchMedia && window.matchMedia('(min-width: 700px)').matches) {
      var f = $('modal').querySelector('input:not([type=checkbox]), select, textarea');
      if (f) f.focus();

  }
  function closeModal() {
    modalCtx = null;
    $('modalBg').classList.remove('show');
    $('modal').innerHTML = '';
    document.body.classList.remove('pl-lock');
  }

  // ---------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------
  document.addEventListener('click', function (e) {
    if (e.target === $('modalBg')) { closeModal(); return; }
    var pick = e.target.closest('.seg button, .swatches button');
    if (pick) {
      Array.prototype.forEach.call(pick.parentNode.children, function (b) { b.classList.toggle('on', b === pick); });
      return;
    }
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');

    if (act.indexOf('m-') === 0) {
      var name = act.slice(2);
      if (name === 'close') closeModal();
      else if (modalCtx && modalCtx[name]) modalCtx[name](id, el);
      return;
    }
    switch (act) {
      case 'toggle': toggle(id, el.getAttribute('data-date')); break;
      case 'today-add': addToday(id); break;
      case 'today-pick':
        var v = $('todayPick') && $('todayPick').value;
        if (v) addToday(v);
        else UI.toast('star', 'Today’s Quests', 'Pick a task first', '');
        break;
      case 'today-remove':
        state.today.ids = state.today.ids.filter(function (x) { return x !== id; });
        commit();
        break;
      case 'schedule': openSchedule({ taskId: id }); break;
      case 'slot-add': openSchedule({ date: el.getAttribute('data-date'), block: el.getAttribute('data-block') }); break;
      case 'ent-del':
        var ent = state.board.filter(function (x) { return x.id === id; })[0];
        state.board = state.board.filter(function (x) { return x.id !== id; });
        if (ent && ent.date === today() && state.today.date === ent.date && (state.today.pulled || []).indexOf(ent.id) !== -1 &&
            !state.board.some(function (x) { return x.task === ent.task && x.date === ent.date; })) {
          state.today.ids = state.today.ids.filter(function (x) { return x !== ent.task; });
        }
        // A quest with no line lives only on the board; nothing else shows it.
        var lt = ent && taskOf(ent.task);
        if (lt && !lineOf(lt.line) && !state.board.some(function (x) { return x.task === lt.id; }) &&
            state.today.ids.indexOf(lt.id) === -1) removeTask(lt.id);
        commit();
        break;
      case 'day': selDay = Number(el.getAttribute('data-i')) || 0; renderBoard(); break;
      case 'week-prev':
      case 'week-next':
        viewWeek += act === 'week-next' ? 1 : -1;
        selDay = viewWeek === 0 ? dowIndex(today()) : 0;
        renderBoard();
        break;
      case 'task-new': openTask(null, id); break;
      case 'task-edit': openTask(id); break;
      case 'ent-edit':
        var ee = state.board.filter(function (x) { return x.id === id; })[0];
        if (ee) openTask(ee.task, null, ee);
        break;
      case 'line-new': openLine(null); break;
      case 'line-edit': openLine(id); break;
      case 'log-add': addLog(id); break;
      case 'log-del':
        state.logs = state.logs.filter(function (x) { return x.id !== id; });
        commit();
        break;
      case 'rm-toggle':
        var c = state.roadmap.cells[id];
        if (c && c.t) { c.done = !c.done; commit(); }
        break;
      case 'rm-restart':
        if (!confirm('Start the 4-week roadmap from this week? Milestone text is kept; the ticks are cleared.')) return;
        state.roadmap.start = GS.weekStart(today());
        Object.keys(state.roadmap.cells).forEach(function (k) { state.roadmap.cells[k].done = false; });
        commit();
        break;
      case 'exam':
        state.settings.exam = !state.settings.exam;
        commit();
        UI.toast('book', 'Exam Week', state.settings.exam ? 'Exam Week is on' : 'Exam Week is off',
          state.settings.exam ? 'One clip and one study block a day. Nothing else.' : 'The full plan is back.');
        break;
      case 'low':
        state.settings.lowDate = lowOn() ? '' : today();
        commit();
        break;
      case 'settings': openSettings(); break;
      case 'rv-open':
        reviewOpen = true;
        render();
        $('blkReview').scrollIntoView({ behavior: 'smooth', block: 'start' });
        break;
      case 'rv-close': reviewOpen = false; render(); break;
      case 'rv-save': saveReview(); break;
      case 'rv-del':
        if (!confirm('Delete the review for the week of ' + fmtRange(id) + '?')) return;
        state.reviews = state.reviews.filter(function (r) { return r.week !== id; });
        commit();
        break;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('[data-split]')) { liveSplit(t); return; }
    if (t.matches('[data-draft]')) {
      var wk = GS.weekStart(today());
      var d = state.drafts[wk] || (state.drafts[wk] = Object.assign({}, draft(wk)));
      var k = t.getAttribute('data-draft');
      d[k] = String(t.value).slice(0, 600);
      persist();
      if (k === 'income' || k === 'saved') $('saveLine').innerHTML = savingsLine(incomeOf(d, weekStats(wk)), num(d.saved));
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-split]')) {
      state.split = rebalance(splitNow(), t.getAttribute('data-split'), num(t.value));
      persist();
      renderSplit();
      if (reviewOpen || isSunday()) renderReview();
      return;
    }
    if (t.id === 'weekHours') {
      state.settings.weekHours = Math.max(0, Math.min(120, Math.round(num(t.value))));
      persist();
      renderSplit();
      if (reviewOpen || isSunday()) renderReview();
      return;
    }
    if (t.matches('[data-rm]')) {
      // Saved in place, not re-rendered, so tabbing to the next milestone keeps focus.
      var k = t.getAttribute('data-rm');
      var c = state.roadmap.cells[k] || (state.roadmap.cells[k] = { t: '', done: false });
      c.t = String(t.value).trim().slice(0, 140);
      if (!c.t) c.done = false;
      persist();
      var box = t.parentNode.querySelector('[data-act="rm-toggle"]');
      if (box) box.disabled = !c.t;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalCtx) { closeModal(); return; }
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (t.matches && t.matches('[data-log]')) { e.preventDefault(); addLog(t.getAttribute('data-log')); return; }
    if (modalCtx && t.matches && t.matches('.modal input:not([type=checkbox])') && modalCtx.save) { e.preventDefault(); modalCtx.save(); }
  });

  // Remember which past reviews are expanded across re-renders.
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d && d.matches && d.matches('details[data-week]')) openHist[d.getAttribute('data-week')] = d.open;
  }, true);

  // Another tab edited the planner.
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    state = load();
    if (!UI.isTyping() && !modalCtx) render();
  });

  render();

  // Ticking a Daily Quest here moves shared XP, same as on the Hub.
  var dailyQ = window.QuestUI ? window.QuestUI.mountDaily('plDaily', {
    compact: true,
    onChange: function () { GS.reconcile(); renderTop(); }
  }) : null;

  document.addEventListener('DOMContentLoaded', function () {
    if (typeof initCloudSync !== 'function') return;
    initCloudSync({
      appKey: 'icis',
      syncedKeys: [GS.KEY],
      onApplied: function () {
        if (GS.onRemoteApplied() === 'adopted' && !UI.isTyping() && !modalCtx) {
          if (dailyQ) dailyQ.redraw();
          renderTop();
        }
      }
    });
    initCloudSync({
      appKey: 'planner',
      syncedKeys: [KEY],
      onApplied: function () {
        state = load();
        GS.reconcile();
        if (!UI.isTyping() && !modalCtx) render();
      }
    });
  });
})();
</script>
</body>
</html>
