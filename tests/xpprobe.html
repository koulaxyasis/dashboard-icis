<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script>
(function () {
  var h = location.hostname;
  if (h !== 'localhost' && h !== '127.0.0.1' && h !== '::1') {
    document.documentElement.innerHTML = '<body>Blocked: localhost only.</body>';
    throw new Error('blocked');
  }
})();
</script>
<title>xp probe</title>
<style>body{margin:0;background:#111;color:#eee;font:12px monospace}
iframe{border:0;position:absolute;left:-9999px;width:390px;height:700px}pre{white-space:pre-wrap;padding:10px}</style>
<script src="../game-state.js"></script>
<script src="../quest-library.js"></script>
<script src="../career-data.js"></script>
<script src="../quest-engine.js"></script>
<script src="../hero-art.js"></script>
</head>
<body>
<pre id="out">pending…</pre>
<script>
// Loads each page in isolation and reports exactly which ledger keys it
// added or changed — so "something awards XP on load" becomes a name.
var PAGES = ['../index.html','../career.html','../tavern.html','../character.html',
  '../quest-editor.html','../guild.html','../nova.html','../main.html','../gym.html',
  '../po-water.html','../caffeine.html','../finance.html'];
var GS = window.GameState;
var L = [];
var fails = 0;

function ledger() {
  GS.reload();
  var l = GS.get().ledger, out = {};
  Object.keys(l).forEach(function (k) { out[k] = l[k].xp; });
  return out;
}

// The whole state, not just the ledger. Any churn here is what cloud-sync
// pushes — and a page that writes on every load makes other open surfaces
// react to it, which is how a reload loop starts.
function rawState() { return localStorage.getItem('icisGameStateV2') || ''; }
function changedKeys(a, b) {
  var A = JSON.parse(a || '{}'), B = JSON.parse(b || '{}'), out = [];
  var keys = {};
  Object.keys(A).forEach(function (k) { keys[k] = 1; });
  Object.keys(B).forEach(function (k) { keys[k] = 1; });
  Object.keys(keys).forEach(function (k) {
    if (JSON.stringify(A[k]) !== JSON.stringify(B[k])) out.push(k);
  });
  return out;
}
function diff(a, b) {
  var added = [], changed = [], removed = [];
  Object.keys(b).forEach(function (k) {
    if (!(k in a)) added.push(k + '=+' + b[k]);
    else if (a[k] !== b[k]) changed.push(k + ' ' + a[k] + '->' + b[k]);
  });
  Object.keys(a).forEach(function (k) { if (!(k in b)) removed.push(k); });
  return { added: added, changed: changed, removed: removed };
}
function total(l) { return Object.keys(l).reduce(function (s, k) { return s + l[k]; }, 0); }

function load(page) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.src = page;
    f.addEventListener('load', function () {
      setTimeout(function () { f.remove(); resolve(); }, 1100);
    });
    document.body.appendChild(f);
  });
}

(async function () {
  GS.reconcile();
  for (var pass = 1; pass <= 2; pass++) {
    L.push('===== pass ' + pass + ' =====');
    for (var i = 0; i < PAGES.length; i++) {
      var before = ledger(), rawBefore = rawState();
      await load(PAGES[i]);
      var after = ledger(), rawAfter = rawState();
      var d = diff(before, after);
      var delta = total(after) - total(before);
      var stateKeys = changedKeys(rawBefore, rawAfter);
      var dirty = delta !== 0 || d.added.length || d.changed.length || d.removed.length || stateKeys.length;
      if (dirty) {
        fails++;
        L.push('DIRTY ' + PAGES[i] + '  XP delta ' + (delta >= 0 ? '+' : '') + delta);
        if (d.added.length)    L.push('    ledger added:   ' + d.added.join(', '));
        if (d.changed.length)  L.push('    ledger changed: ' + d.changed.join(', '));
        if (d.removed.length)  L.push('    ledger removed: ' + d.removed.join(', '));
        if (stateKeys.length)  L.push('    state keys written: ' + stateKeys.join(', '));
      } else {
        L.push('inert ' + PAGES[i]);
      }
    }
  }
  L.unshift(fails === 0
    ? '### ALL PAGES INERT - no page load writes state ###'
    : '### ' + fails + ' PAGE LOADS MUTATED STATE ###');
  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body></html>
