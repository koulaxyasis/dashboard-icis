<body>
<pre id="out">pending…</pre>
<script>
var L = [];
function chk(label, ok, extra) { L.push((ok ? 'PASS ' : 'FAIL ') + label + (extra ? '  ' + extra : '')); return ok; }
function eq(label, a, b) { return chk(label + ' = ' + a, String(a) === String(b), String(a) === String(b) ? '' : 'expected ' + b); }
var GS = window.GameState;
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function plan() { return JSON.parse(localStorage.getItem('planner:v1') || 'null'); }
function ledger() { GS.reload(); return GS.get().ledger; }
function planXp() {
  var l = ledger(); return Object.keys(l).filter(function (k) { return k.indexOf('plan:') === 0; })
    .reduce(function (a, k) { return a + l[k].xp; }, 0);
}

function open(page, width) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.width = (width || 1100) + 'px'; f.style.height = '900px';
    f.src = page + (page.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();
    f.addEventListener('load', function () { setTimeout(function () { resolve(f); }, 900); });
    document.body.appendChild(f);
  });
}

(async function () {
  try {
    // ---- a first visit renders the starter world and writes NOTHING
    var f = await open('../planner.html');
    var w = f.contentWindow, d = w.document;
    function q(sel) { return d.querySelector(sel); }
    function qa(sel) { return Array.prototype.slice.call(d.querySelectorAll(sel)); }
    function click(sel) { var el = typeof sel === 'string' ? q(sel) : sel; if (!el) throw new Error('missing ' + sel); el.click(); }

    eq('first visit stores nothing', localStorage.getItem('planner:v1'), 'null');
    eq('three quest lines seeded', qa('.pl-line').length, 3);
    eq('eighteen starter tasks', qa('.pl-line .pl-task').length, 18);
    eq('roadmap: 4 weeks x 3 lines', qa('[data-rm]').length, 12);
    chk('roadmap seeded with milestones', qa('[data-rm]').every(function (t) { return t.value.length > 5; }));
    eq('split defaults 40/35/25', qa('[data-split]').map(function (r) { return r.value; }).join('/'), '40/35/25');
    chk('weekly board has 7 days x 3 blocks', qa('.pl-col').length === 7 && qa('.pl-cell').length === 21);
    chk('the Hub’s Daily Quests show on the planner', qa('#plDaily .q').length >= 3, qa('#plDaily .q').length + ' rows');
    chk('log fields include $ approved earnings', !!q('[data-keep="log|clip|earned"]'));

    // ---- today's cap of five, and the swap question on the sixth
    var stars = qa('.pl-line [data-act="today-add"]');
    for (var i = 0; i < 5; i++) click(qa('.pl-line [data-act="today-add"]')[i]);
    eq('five on today', plan().today.ids.length, 5);
    eq('today rendered five rows', qa('#today .pl-task').length, 5);
    click(qa('.pl-line [data-act="today-add"]')[6]);
    chk('a sixth asks which to swap', q('#modalBg').classList.contains('show') && qa('[data-act="m-swap"]').length === 5);
    eq('  and has not added it yet', plan().today.ids.length, 5);
    var sixth = qa('.pl-line .pl-task')[6].querySelector('[data-act="toggle"]').getAttribute('data-id');
    var out = qa('[data-act="m-swap"]')[0].getAttribute('data-id');
    click(qa('[data-act="m-swap"]')[0]);
    eq('swap keeps the cap', plan().today.ids.length, 5);
    chk('  the chosen one swapped out', plan().today.ids.indexOf(out) === -1 && plan().today.ids.indexOf(sixth) !== -1);
    chk('  modal closed', !q('#modalBg').classList.contains('show'));

    // ---- XP: deep 30 / medium 15 / light 5, into the SHARED ledger
    var xp0 = GS.totals().totalXp;
    var deep = qa('.pl-line .pl-task').filter(function (r) { return r.textContent.indexOf('Case study 1') !== -1; })[0];
    click(deep.querySelector('[data-act="toggle"]'));
    await wait(50);
    eq('deep task pays 30 into the shared ledger', GS.reload() && (GS.totals().totalXp - xp0), 30);
    eq('  under the planner key', planXp(), 30);
    var med = qa('.pl-line .pl-task').filter(function (r) { return r.textContent.indexOf('Edit + post 2 clips') !== -1; })[0];
    click(med.querySelector('[data-act="toggle"]'));
    var light = qa('.pl-line .pl-task').filter(function (r) { return r.textContent.indexOf('no FYP') !== -1; })[0];
    click(light.querySelector('[data-act="toggle"]'));
    eq('medium + light add 15 + 5', planXp(), 50);
    chk('clipping XP lands in Fortune', ledger()['plan:clip_post:' + GS.todayKey()].disc === 'fortune');
    chk('design XP lands in Craft', ledger()['plan:des_case_landing:once'].disc === 'arcana');
    GS.reconcile(); GS.reconcile();
    eq('reconcile is idempotent', planXp(), 50);
    // untick revokes, re-tick does not stack
    click(qa('.pl-line .pl-task').filter(function (r) { return r.textContent.indexOf('no FYP') !== -1; })[0].querySelector('[data-act="toggle"]'));
    eq('unticking revokes', planXp(), 45);
    click(qa('.pl-line .pl-task').filter(function (r) { return r.textContent.indexOf('no FYP') !== -1; })[0].querySelector('[data-act="toggle"]'));
    eq('re-ticking pays once', planXp(), 50);
    eq('page XP chip agrees', q('#xpAll').textContent, '50');
    await wait(50);   // the HUD redraws on the next tick; game-state coalesces notifications
    eq('HUD shows the shared total', d.getElementById('hudXp').textContent.split('/')[0].trim(),
       String(GS.totals().into));

    // deleting a done task keeps the XP it earned
    click(qa('.pl-line .pl-task').filter(function (r) { return r.textContent.indexOf('Case study 1') !== -1; })[0].querySelector('[data-act="task-edit"]'));
    w.confirm = function () { return true; };
    click('[data-act="m-del"]');
    chk('task deleted', !plan().tasks.some(function (t) { return t.id === 'des_case_landing'; }));
    eq('  its XP is kept', planXp(), 50);

    // ---- task editor: create with every field
    click('[data-act="task-new"][data-id="finance"]');
    q('#mTitle').value = 'Write variance commentary';
    click('#mEnergy [data-en="deep"]');
    q('#mMin').value = '50';
    q('#mDue').value = GS.shiftKey(GS.todayKey(), 2);
    click('#mRepeat [data-rp="weekly"]');
    click('[data-act="m-save"]');
    var made = plan().tasks.filter(function (t) { return t.title === 'Write variance commentary'; })[0];
    chk('task created with all fields', !!made && made.line === 'finance' && made.energy === 'deep' &&
      made.minutes === 50 && made.repeat === 'weekly' && made.due === GS.shiftKey(GS.todayKey(), 2),
      JSON.stringify(made));
    click('[data-act="task-new"][data-id="finance"]');
    click('[data-act="m-save"]');
    chk('empty title is rejected inline', q('#mErr').textContent.length > 0 && q('#modalBg').classList.contains('show'));
    click('[data-act="m-close"]');

    // ---- low-energy day shows only light tasks
    click('#togLow');
    var shown = qa('.pl-line .pl-task');
    chk('low-energy: only light tasks', shown.length > 0 && shown.every(function (r) { return r.querySelector('.chip.ok'); }),
        shown.length + ' shown');
    chk('  today list filtered too', qa('#today .pl-task').every(function (r) { return r.querySelector('.chip.ok'); }));
    eq('  stored as today only', plan().settings.lowDate, GS.todayKey());
    click('#togLow');

    // ---- exam week hides everything but 1 clip + a study block
    click('#togExam');
    chk('exam: quest lines hidden', q('#blkLines').hidden && q('#blkRoadmap').hidden && q('#blkSplit').hidden);
    eq('exam: today is exactly two items', qa('#today .pl-task').length, 2);
    chk('  a clip and a study block', /Post 1 clip/.test(q('#today').textContent) && /Study block/.test(q('#today').textContent));
    eq('exam: board shows 2 per day', qa('#board .pl-ent').length, 14);
    var before = planXp();
    click(qa('#today [data-act="toggle"]')[0]);
    eq('  study block pays deep XP', planXp() - before, 30);
    click('#togExam');
    chk('exam off restores the plan', !q('#blkLines').hidden && qa('.pl-line').length === 3);

    // ---- peak focus suggests deep work into that block
    click('[data-act="settings"]');
    q('#mPf').value = '14:00'; q('#mPt').value = '17:00';
    click('[data-act="m-save"]');
    eq('peak stored', plan().settings.peakFrom, '14:00');
    eq('board marks the afternoon as peak', qa('.pl-cell.peak').length, 7);
    var deepRow = qa('.pl-line .pl-task').filter(function (r) { return r.textContent.indexOf('INCO: clean') !== -1; })[0];
    click(deepRow.querySelector('[data-act="schedule"]'));
    eq('scheduling a deep task defaults to the peak block', q('#mBlock').value, 'afternoon');
    chk('  and says why', /peak-focus slot/.test(q('#mHint').textContent));
    click('[data-act="m-save"]');
    eq('board entry created', plan().board.length, 1);
    chk('  rendered on the board', /INCO: clean/.test(q('#board').textContent));

    // ---- a quest written straight into a board slot
    var nTasks = plan().tasks.length;
    click(qa('[data-act="slot-add"]')[2]);
    chk('slot + offers pick or write', !!q('#mMode') && !q('#mPick').hidden && q('#mNew').hidden);
    click('#mMode [data-mode="new"]');
    chk('  write mode shows the quest form', q('#mPick').hidden && !q('#mNew').hidden);
    click('[data-act="m-save"]');
    chk('  an empty quest is refused', /Write the quest/.test(q('#mErr').textContent) && plan().tasks.length === nTasks);
    q('#mTitle').value = 'Gym: upper body';
    click('#mEnergy [data-en="deep"]');
    await wait(10);
    chk('  deep energy brings the peak hint', /peak focus/i.test(q('#mHint').textContent));
    click('[data-act="m-save"]');
    var made2 = plan().tasks.filter(function (t) { return t.title === 'Gym: upper body'; })[0];
    chk('  the quest is created', !!made2 && made2.energy === 'deep' && made2.repeat === 'none' && made2.line === '');
    var ent2 = plan().board.filter(function (e) { return made2 && e.task === made2.id; })[0];
    chk('  and put in that slot', !!ent2 && ent2.block === 'evening' && made2.due === ent2.date);
    chk('  rendered on the board', /Gym: upper body/.test(q('#board').textContent));
    var gymEnt = qa('#board .pl-ent').filter(function (r) { return /Gym: upper body/.test(r.textContent); })[0];
    click(gymEnt.querySelector('[data-act="ent-del"]'));
    chk('  taking a lineless quest off the board deletes it',
        !plan().tasks.some(function (t) { return t.title === 'Gym: upper body'; }) && plan().board.length === 1);

    // ---- a quest on today's board lands on today's list too
    click(q('#today [data-act="today-remove"]'));

    var pickT = plan().tasks.filter(function (t) {

    click('[data-act="m-save"]');
    chk('board quest for today joins today’s list', plan().today.ids.indexOf(pickT.id) !== -1 &&
        plan().today.ids.length === nToday + 1);
    click(q('#today [data-act="today-remove"][data-id="' + pickT.id + '"]'));
    click(qa('.pl-line [data-act="toggle"]')[0]); click(qa('.pl-line [data-act="toggle"]')[0]);
    chk('  removed from today, it is not pulled back', plan().today.ids.indexOf(pickT.id) === -1);
    q('#todayPick').value = pickT.id;
    click('[data-act="today-pick"]');
    eq('  added back by hand', plan().today.ids.indexOf(pickT.id) !== -1, true);
    var pEnt = plan().board.filter(function (e) { return e.task === pickT.id; })[0];
    click(q('#board [data-act="ent-del"][data-id="' + pEnt.id + '"]'));
    chk('  off today’s board, it leaves today’s list', plan().today.ids.indexOf(pickT.id) === -1);
    chk('  but a task with a quest line is kept', plan().tasks.some(function (t) { return t.id === pickT.id; }));
    // ---- editing a quest from the board: rename, and move it
    click(q('[data-act="slot-add"][data-date="' + GS.todayKey() + '"][data-block="evening"]'));
    q('#mTask').value = pickT.id;
    click('[data-act="m-save"]');
    var mvEnt = plan().board.filter(function (e) { return e.task === pickT.id; })[0];
    chk('scheduled for today evening, it is on today’s list', plan().today.ids.indexOf(pickT.id) !== -1);
    click(q('#board [data-act="ent-edit"][data-id="' + mvEnt.id + '"]'));
    chk('clicking a board quest opens its editor', q('#mTitle').value === pickT.title && q('#mBlock').value === 'evening' &&
        q('#mDay').value === GS.todayKey());
    q('#mTitle').value = 'Renamed from the board';
    var otherDay = GS.weekKeys(GS.weekStart(GS.todayKey())).filter(function (k) { return k !== GS.todayKey(); })[0];
    q('#mDay').value = otherDay;
    q('#mBlock').value = 'morning';
    click('[data-act="m-save"]');
    var mv = plan().board.filter(function (e) { return e.id === mvEnt.id; })[0];
    chk('  the title is saved', plan().tasks.filter(function (t) { return t.id === pickT.id; })[0].title === 'Renamed from the board');
    chk('  the entry moved', mv.date === otherDay && mv.block === 'morning');
    chk('  moved off today, it left today’s list', plan().today.ids.indexOf(pickT.id) === -1);
    chk('  the board shows the new title', /Renamed from the board/.test(q('#board').textContent));
    click(q('#board [data-act="ent-edit"][data-id="' + mvEnt.id + '"]'));
    q('#mDay').value = GS.todayKey();
    click('[data-act="m-save"]');
    chk('  moved back to today, it rejoins today’s list', plan().today.ids.indexOf(pickT.id) !== -1);
    eq('today is back to five', plan().today.ids.length, 5);

    // ---- split sliders always total 100
    var r0 = q('[data-split="clip"]');
    r0.value = '60';
    r0.dispatchEvent(new w.Event('input', { bubbles: true }));
    r0.dispatchEvent(new w.Event('change', { bubbles: true }));
    var sp = plan().split;
    eq('split totals 100 after a move', sp.clip + sp.design + sp.finance, 100);
    eq('  moved slider kept its value', sp.clip, 60);
    chk('  others shrank in proportion', sp.design > sp.finance, JSON.stringify(sp));
    chk('planned vs actual shown per track', qa('.pl-pva').length === 3 && /h done of/.test(q('#splitMeta').textContent));

    // ---- logs feed the weekly totals and the review
    q('[data-keep="log|clip|clips"]').value = '4';
    q('[data-keep="log|clip|views"]').value = '12000';
    q('[data-keep="log|clip|earned"]').value = '35.5';
    click('[data-act="log-add"][data-id="clip"]');
    eq('log entry stored', plan().logs.length, 1);
    chk('  inputs cleared', q('[data-keep="log|clip|clips"]').value === '');
    chk('  weekly sum shows', /4<\/b> clips posted/.test(q('#lines').innerHTML));

    // a half-typed log number survives a re-render triggered elsewhere
    q('[data-keep="log|design|pitches"]').value = '3';
    click(qa('.pl-line .pl-task')[0].querySelector('[data-act="toggle"]'));
    eq('half-typed log survives a re-render', q('[data-keep="log|design|pitches"]').value, '3');

    // ---- Sunday review: openable any day, totals the week, savings line
    click('[data-act="rv-open"]');
    chk('review open', !!q('[data-draft="paid"]'));
    chk('  earned is summed from money fields', /\$35\.5/.test(q('#review').textContent));
    var inc = q('[data-draft="income"]'); inc.value = '100'; inc.dispatchEvent(new w.Event('input', { bubbles: true }));
    var sv = q('[data-draft="saved"]'); sv.value = '75'; sv.dispatchEvent(new w.Event('input', { bubbles: true }));
    chk('  savings line updates live', /75%/.test(q('#saveLine').textContent) && /target 70%/.test(q('#saveLine').textContent));
    var nx = q('[data-draft="next"]'); nx.value = 'Ship case study 2'; nx.dispatchEvent(new w.Event('input', { bubbles: true }));
    click('[data-act="rv-save"]');
    eq('review saved to history', plan().reviews.length, 1);
    eq('  with the big quest', plan().reviews[0].next, 'Ship case study 2');
    eq('  and the savings', plan().reviews[0].income + '/' + plan().reviews[0].saved, '100/75');
    chk('  history lists it', /Ship case study 2/.test(q('#history').textContent));
    click('[data-act="rv-save"]');
    eq('re-saving the same week replaces, not duplicates', plan().reviews.length, 1);

    // ---- quest line editor
    click('[data-act="line-new"]');
    q('#mName').value = 'Side Hustle';
    q('#mFields').value = 'Hours\n$ Income';
    click('[data-act="m-save"]');
    eq('new line added', plan().lines.length, 4);
    var nl = plan().lines[3];
    chk('  fields parsed with money flag', nl.fields.length === 2 && nl.fields[1].money && !nl.fields[0].money, JSON.stringify(nl.fields));
    var sp2 = plan().split, tot = Object.keys(sp2).reduce(function (a, k) { return a + sp2[k]; }, 0);

    click('[data-act="line-edit"][data-id="' + nl.id + '"]');
    click('[data-act="m-del"]');
    eq('line deleted', plan().lines.length, 3);
    var keptXp = planXp();

    // ---- the narrow layout keeps the page inside the viewport
    f.style.width = '320px';
    await wait(100);
    var sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth), vw = d.documentElement.clientWidth;

    chk('phone board shows day tabs', w.getComputedStyle(q('.pl-tabs')).display === 'flex');

    f.remove();

    // ---- a reload reads everything back and writes nothing
    var snap = localStorage.getItem('planner:v1'), gsSnap = localStorage.getItem('icisGameStateV2');
    var f2 = await open('../planner.html', 390);
    var d2 = f2.contentWindow.document;
    eq('reload is inert (planner)', localStorage.getItem('planner:v1') === snap, 'true');
    eq('reload is inert (game state)', localStorage.getItem('icisGameStateV2') === gsSnap, 'true');
    eq('reload restores today', d2.querySelectorAll('#today .pl-task').length, 5);
    f2.remove();

    // ---- the Hub links it and shows today's progress
    var f3 = await open('../index.html', 390);
    var tile = f3.contentWindow.document.querySelector('#world a[href="planner.html"]');
    chk('Hub world map links the Planner', !!tile);
    chk('  with today’s progress', !!tile && /\d+\/5 today/.test(tile.textContent), tile ? tile.textContent : '');
    eq('Hub XP bar includes planner XP', GS.reload() && Object.keys(GS.get().ledger).some(function (k) { return k.indexOf('plan:') === 0; }), 'true');
    f3.remove();

    // ---- the Hub shows the War Room's Today's Quests, and ticks them
    var f4 = await open('../index.html', 390), d4 = f4.contentWindow.document;
    eq('Hub lists today’s planner quests', d4.querySelectorAll('#plannerQuests .q').length, plan().today.ids.length);
    var hubBox = Array.prototype.filter.call(d4.querySelectorAll('#plannerQuests [data-pl]'), function (b) {
      return !b.classList.contains('on');
    })[0];

    chk('  unticking takes it back', !plan().done[hubId] && planXp() === xpHub);
    f4.remove();

    // ---- a new day carries every unfinished quest forward, on any page
    var pd = plan(), yday = GS.shiftKey(GS.todayKey(), -1);
    var oneOffs = pd.tasks.filter(function (t) { return t.repeat === 'none' && !pd.done[t.id]; });
