<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script>
// Safety guard: these pages seed and CLEAR localStorage. Refuse to run
// anywhere except a local dev server so they can never wipe live data.
(function () {
  var h = location.hostname;
  if (h !== 'localhost' && h !== '127.0.0.1' && h !== '::1') {
    document.documentElement.innerHTML =
      '<body style="background:#0B0E1A;color:#AFB4C6;font:14px system-ui;padding:40px">' +
      '<h1 style="color:#F2777A">Blocked</h1>' +
      '<p>This is a local test harness. It clears localStorage, so it only runs on localhost.</p></body>';
    throw new Error('test harness blocked off localhost');
  }
})();
</script>
<title>smoke</title>
<style>body{margin:0;background:#111;color:#eee;font:12px monospace}
iframe{border:0;position:absolute;left:-9999px;top:0}pre{white-space:pre-wrap;padding:10px}</style>
<script src="../game-state.js"></script>
<script src="../quest-library.js"></script>
<script src="../career-data.js"></script>
<script src="../quest-engine.js"></script>
<script src="../hero-art.js"></script>
</head>
<body>
<pre id="out">pending…</pre>
<script>
var L = [];
function chk(label, ok, extra){ L.push((ok?'PASS ':'FAIL ')+label+(extra?'  '+extra:'')); return ok; }
function eq(label, a, b){ return chk(label + ' = ' + a, String(a)===String(b), String(a)===String(b)?'':'expected '+b); }

var GS = window.GameState, QE = window.QuestEngine, HA = window.HeroArt;

// Containers that MUST have content. If a page's script throws mid-render
// these stay empty, which is the signal we key on.
var PAGES = {
  '../index.html':        ['bName','story','dailyQuests','myQuests','contracts','world','camp','social','reward'],
  '../career.html':       ['mission','chapters','skills'],
  '../tavern.html':       ['plans','people','suggestions','memories','stXp'],
  '../character.html':    ['bName','oLv','oShield','oQuests','oContract','oNext','oDisc'],
  '../quest-editor.html': ['list','filters','meta'],
  '../guild.html':        ['bosses'],
  '../nova.html':         ['novaMain'],
  '../main.html':         ['goalTickerStage','dailyQuests','gmCardToday'],
  '../gym.html':          [],
  '../po-water.html':     [],
  '../caffeine.html':     ['logList'],
  '../finance.html':      []
};
var NO_NAV = { '../finance.html': true };
var WIDTHS = [320, 390, 768, 1100];   // phone → desktop

var baseline = null;   // what every page's HUD must agree with
var dailySeen = {};    // page -> the daily quest titles it rendered

function snapshot() {
  GS.reload();
  var t = GS.totals();
  return {
    xp: t.totalXp, level: t.level, score: t.score,
    streak: GS.streakInfo().count,
    board: QE.todayView().list.map(function(q){return q.id;}).join(','),
    equipment: JSON.stringify(GS.get().player.equipment),
    customs: (GS.get().questCustom||[]).map(function(q){return q.id;}).join(',')
  };
}

function probe(page, ids) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.width = WIDTHS[1] + 'px';
    f.style.height = '760px';
    f.src = page;
    f.addEventListener('load', function () {
      setTimeout(function () {
        var d;
        try { d = f.contentWindow.document; }
        catch (e) { chk(page + ' same-origin', false, e.message); f.remove(); return resolve(); }

        // 1. rendered
        var empty = ids.filter(function (id) {
          var el = d.getElementById(id);
          return !el || (!el.textContent.trim() && !el.children.length);
        });
        chk(page, empty.length === 0, empty.length ? 'not rendered: ' + empty.join(', ') : '');

        // 2. shared chrome — VISIBLE, not merely present. A module that
        //    dies on load leaves these missing; a page whose own layout
        //    covers them leaves them zero-height.
        function visible(id) {
          var el = d.getElementById(id);
          if (!el) return false;
          var r = el.getBoundingClientRect();
          var cs = f.contentWindow.getComputedStyle(el);
          return r.height > 20 && cs.display !== 'none' && cs.visibility !== 'hidden';
        }
        chk(page + ' :: hud visible', visible('icisHud'));
        if (!NO_NAV[page]) chk(page + ' :: nav visible', visible('icisNav'));

        // 3. the HUD must agree with the shared state on every page
        var orb = d.getElementById('hudOrb');
        var xpEl = d.getElementById('hudXp');
        chk(page + ' :: hud level matches', !!orb && orb.textContent === String(baseline.level),
            orb ? 'got ' + orb.textContent + ' expected ' + baseline.level : 'no orb');
        chk(page + ' :: hud xp bar present', !!xpEl && /\d+\s*\/\s*\d+/.test(xpEl.textContent),
            xpEl ? xpEl.textContent : 'missing');

        // A page that also prints the level in its body must agree with its
        // OWN hud. This catches state changing mid-render: the hud redraws
        // on the change while the body keeps the number it read earlier.
        var bodyLv = d.getElementById('oLv');
        if (bodyLv && orb) {
          chk(page + ' :: body level agrees with hud',
              bodyLv.textContent.trim() === orb.textContent.trim(),
              'body=' + bodyLv.textContent.trim() + ' hud=' + orb.textContent.trim());
        }
        var bodyStreak = d.getElementById('oStreak');
        if (bodyStreak) {
          chk(page + ' :: body streak matches state',
              bodyStreak.textContent.trim() === String(baseline.streak),
              'body=' + bodyStreak.textContent.trim() + ' expected ' + baseline.streak);
        }

        // 4. the shared daily board: record what this page showed
        var dq = d.getElementById('dailyQuests');
        if (dq) {
          dailySeen[page] = Array.prototype.map.call(
            dq.querySelectorAll('.q-t'), function (n) { return n.textContent.trim(); }).join(' | ');
          chk(page + ' :: daily board rendered', !!dailySeen[page], dailySeen[page] || 'empty');
        }

        // 5. an ordinary load must never re-announce progress
        chk(page + ' :: no level-up overlay on ordinary load', !d.querySelector('.lvlup'));
        chk(page + ' :: no milestone toast on ordinary load', !d.querySelector('.toast'));

        // 6. responsive: no horizontal overflow at any width
        WIDTHS.forEach(function (w) {
          f.style.width = w + 'px';
          var sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
          var vw = d.documentElement.clientWidth;
          chk(page + ' :: no overflow @' + w, sw <= vw + 1, 'scrollW=' + sw + ' vw=' + vw);
        });
        f.style.width = WIDTHS[1] + 'px';

        f.remove();
        resolve();
      }, 1200);
    });
    f.addEventListener('error', function () { chk(page + ' load', false); resolve(); });
    document.body.appendChild(f);
  });
}

(async function () {
  // ---- set up a known, non-trivial state -------------------------
  GS.reconcile();
  QE.ensureToday();
  // a custom quest, to prove authored content survives page loads
  QE.resetCustom();
  var made = QE.createQuest({ id:'u_smoke_probe', practicalTitle:'Smoke probe quest',
    loreTitle:'The Proving', description:'Exists only to be counted.', category:'recovery',
    difficulty:'light', xp:10, estimatedMinutes:5, cooldownDays:0, maximumUsesPerWeek:7,
    weight:1, minimumLevel:1 });
  chk('setup :: custom quest created', made.ok, made.ok ? '' : JSON.stringify(made.errors));
  // equip cosmetics, to prove they persist and change nothing
  GS.update(function (s) {
    s.player.unlockedCosmetics.push('border_gilded');
    s.player.equipment = { portrait:'dusk', border:'border_gilded', background:'deepnight',
                           title:'', tool:'quill', companion:'wisp' };
  });

  baseline = snapshot();
  L.push('--- baseline: level ' + baseline.level + ' · ' + baseline.xp + ' XP · streak ' +
         baseline.streak + ' · board ' + baseline.board);

  // ---- walk every page -------------------------------------------
  for (var p in PAGES) await probe(p, PAGES[p]);

  // ---- nothing may have shifted just from loading pages ----------
  var after = snapshot();
  eq('after all loads :: total XP unchanged', after.xp, baseline.xp);
  eq('after all loads :: level unchanged', after.level, baseline.level);
  eq('after all loads :: Adventurer Score unchanged', after.score, baseline.score);
  eq('after all loads :: streak unchanged', after.streak, baseline.streak);
  eq('after all loads :: quest board unchanged', after.board, baseline.board);
  eq('after all loads :: equipment persisted', after.equipment, baseline.equipment);
  eq('after all loads :: custom quest survived', after.customs, baseline.customs);
  chk('after all loads :: custom quest still in library', !!QE.byId('u_smoke_probe'));

  // ---- a second full pass must be just as inert -------------------
  for (var p2 in PAGES) await probe(p2, PAGES[p2]);
  var after2 = snapshot();
  eq('second pass :: total XP still unchanged', after2.xp, baseline.xp);
  eq('second pass :: streak still unchanged', after2.streak, baseline.streak);
  eq('second pass :: board still unchanged', after2.board, baseline.board);

  // ---- typing must survive a re-render --------------------------------
  // The real failure: you start typing a quest, something triggers a
  // redraw (a cloud-sync apply, another surface editing the list), the
  // container's innerHTML is replaced and the input you are in is gone.
  await (function () {
    return new Promise(function (resolve) {
      var f = document.createElement('iframe');
      f.style.width = '390px'; f.style.height = '760px';
      f.src = '../index.html?t=' + Date.now();
      f.addEventListener('load', function () {
        setTimeout(function () {
          var d = f.contentWindow.document;
          var input = d.querySelector('[data-pqin]');
          chk('add-quest input exists', !!input);
          if (!input) { f.remove(); return resolve(); }

          input.focus();
          input.value = 'half-typed quest';
          var focusedBefore = d.activeElement === input;
          chk('input can take focus', focusedBefore);

          // Force the redraws a sync apply would cause.
          f.contentWindow.dispatchEvent(new CustomEvent('goals-changed'));
          d.dispatchEvent(new CustomEvent('icis:update', { detail: {} }));

          setTimeout(function () {
            var after = d.querySelector('[data-pqin]');
            chk('input survived the redraw', !!after && after === input);
            chk('typed text survived the redraw',
                !!after && after.value === 'half-typed quest',
                after ? 'value="' + after.value + '"' : 'gone');
            chk('focus survived the redraw', d.activeElement === after);
            f.remove(); resolve();
          }, 500);
        }, 1200);
      });
      document.body.appendChild(f);
    });
  })();

  // ---- the Hub and the Quest Board must show the SAME daily quests -----
  var hubDaily = dailySeen['../index.html'];
  var boardDaily = dailySeen['../main.html'];
  chk('Hub rendered the daily board', !!hubDaily, hubDaily || '');
  chk('Quest Board rendered the daily board', !!boardDaily, boardDaily || '');
  eq('Hub and Quest Board show the same five daily quests', boardDaily, hubDaily);
  eq('daily board matches the engine',
     hubDaily, QE.todayView().list.map(function (q) { return q.practicalTitle; }).join(' | '));

  // ---- a real level-up must announce exactly ONCE ----------------------
  // Loads index.html and reports whether the level-up overlay appeared.
  function loadAndSeeOverlay(page) {
    return new Promise(function (resolve) {
      var f = document.createElement('iframe');
      f.style.width = '390px'; f.style.height = '700px';
      f.src = page + '?t=' + Date.now();     // defeat the bfcache
      f.addEventListener('load', function () {
        setTimeout(function () {
          var saw = false;
          try { saw = !!f.contentWindow.document.querySelector('.lvlup'); } catch (e) {}
          f.remove(); resolve(saw);
        }, 1200);
      });
      document.body.appendChild(f);
    });
  }

  // Jump several levels in one go.
  GS.award('test:levelup', 4000, 'resolve', { text: 'test grant' });
  var lvlNow = GS.totals().level;
  chk('setup :: level actually rose', lvlNow > baseline.level, 'now ' + lvlNow);
  chk('level-up announced on the load after it happens', await loadAndSeeOverlay('../index.html'));
  chk('NOT announced again on the next load', !(await loadAndSeeOverlay('../index.html')));
  chk('NOT announced on a third load', !(await loadAndSeeOverlay('../index.html')));
  chk('NOT announced on a different page either', !(await loadAndSeeOverlay('../character.html')));
  GS.revoke('test:levelup');

  // ---- a stale marker inside the SYNCED blob must not re-announce ------
  // This is what cloud sync does when another device pushes an older
  // snapshot. The notification marker is device-local, so it must survive.
  chk('device-local seen marker exists', !!GS.readJSON('icis:seen', null));
  var seenBefore = (GS.readJSON('icis:seen', {}) || {}).level;
  GS.update(function (s) {
    s.lastSeen = { level: 1, disciplines: {}, achievements: [] };   // stale, as if restored by sync
  });
  chk('stale synced marker does not re-announce', !(await loadAndSeeOverlay('../index.html')));
  eq('stale synced marker did not clobber the local one',
     (GS.readJSON('icis:seen', {}) || {}).level, seenBefore);

  QE.deleteQuest('u_smoke_probe');

  var fails = L.filter(function (x) { return x.indexOf('FAIL') === 0; }).length;
  var passes = L.filter(function (x) { return x.indexOf('PASS') === 0; }).length;
  L.unshift(fails === 0 ? '### SMOKE OK (' + passes + ' checks) ###' : '### ' + fails + ' FAILURES ###');
  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body></html>
