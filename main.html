<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1A">
<title>Quest Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="game-state.js"></script>
<script src="quest-library.js"></script>
<script src="career-data.js"></script>
<script src="quest-engine.js"></script>
<script src="hero-art.js"></script>
<script src="ui-kit.js"></script>
<script src="quest-ui.js"></script>
<script src="planner-core.js"></script>
<style>
/* =============================================================
   Quest Board — restyled onto the shared design system.

   Every class name here is one the existing markup or JS already
   uses, so the page's behaviour (ticker, day ring, rollover, drag
   reorder, streak) is untouched; only the skin changed.
   ============================================================= */
.page { max-width: 1120px; margin: 0 auto; }

.dash-title {
  margin: 0; font-size: 26px; font-weight: 700;
  letter-spacing: -0.025em; color: var(--text);
}
.qb-lore { font-size: 11px; font-weight: 700; letter-spacing: .18em;
           text-transform: uppercase; color: var(--gold); }
.qb-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.qb-head { margin-bottom: 16px; }

/* ---------- goal ticker ---------- */
.ticker-row { margin-bottom: 12px; }
.goal-ticker {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 14px; border-radius: var(--r-lg);
  background: var(--panel); border: 1px solid var(--line);
  overflow: hidden;
}
.goal-ticker-led { flex: none; display: grid; place-items: center; }
.goal-ticker-led-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 9px var(--ok);
}
.goal-ticker-label {
  flex: none; font-size: 9.5px; font-weight: 800; letter-spacing: .16em;
  color: var(--gold);
}
.goal-ticker-stage { flex: 1; min-width: 0; height: 20px; position: relative; overflow: hidden; }
.goal-ticker-row {
  display: flex; align-items: center; gap: 8px;
  height: 20px; white-space: nowrap;
}
.goal-ticker-status { flex: none; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.goal-ticker-status[data-status="done"] { color: var(--ok); }
.goal-ticker-status[data-status="pending"] { color: var(--warn); }
.goal-ticker-text {
  font-size: 12.5px; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis;
}
.goal-ticker-meta {
  flex: none; font-family: var(--mono); font-size: 11px; color: var(--text-3);
}

/* ---------- day ring ---------- */
.day-ring-wrap {
  display: flex; align-items: center; gap: 18px;
  padding: 16px; margin-bottom: 4px;
  border-radius: var(--r-lg);
  background: var(--panel); border: 1px solid var(--line);
}
.day-ring { position: relative; width: 120px; height: 120px; flex: none; }
.day-ring svg { width: 120px; height: 120px; transform: rotate(-90deg); }
.day-ring-track {
  fill: none; stroke: rgba(255,255,255,.07); stroke-width: 9;
}
.day-ring-fill {
  fill: none; stroke: var(--gold); stroke-width: 9; stroke-linecap: round;
  transition: stroke-dashoffset .6s cubic-bezier(.22,1,.36,1);
}
.day-ring-overlay {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
}
.day-ring-percent {
  font-family: var(--mono); font-size: 25px; font-weight: 700; color: var(--text); line-height: 1;
}
.day-ring-phase {
  font-size: 8.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  color: var(--text-3); margin-top: 4px;
}
.day-ring-clock { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }
.day-ring-text { flex: 1; min-width: 0; }
.day-ring-status { font-size: 15px; font-weight: 650; color: var(--text); }
.day-ring-remaining { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
.day-ring-hours { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-top: 3px; }

/* streak pill */
.gm-streak {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 6px 11px; border-radius: 999px;
  background: rgba(255,255,255,.04); border: 1px solid var(--line);
  color: var(--text-3); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
}
.gm-streak-num { font-family: var(--mono); font-size: 13px; color: var(--text); }
.gm-streak-active { border-color: rgba(233,190,110,.45); color: var(--gold); background: rgba(233,190,110,.1); }
.gm-streak-active .gm-streak-num { color: var(--gold); }
.gm-streak-icon { filter: grayscale(1) brightness(1.4); }

@media (max-width: 560px) {
  .dash-title { font-size: 22px; }
  .day-ring-wrap { gap: 13px; padding: 14px; }
  .day-ring, .day-ring svg { width: 92px; height: 92px; }
  .day-ring-percent { font-size: 20px; }
}
</style>
</head>
<body data-icis>
<div class="page">

  <div class="qb-head">
    <div class="qb-lore">Quest Board</div>
    <h1 class="dash-title">Today</h1>
    <div class="qb-sub">Five quests chosen for you, and up to five you picked in the War Room.</div>
    <div class="gm-streak" id="gmStreak" style="margin-top:10px">
      <span class="gm-streak-icon">⚡</span>
      <span class="gm-streak-num" id="gmStreakNum">0</span>
      <span>day streak</span>
    </div>
  </div>

  <div class="ticker-row">
    <div class="goal-ticker" id="goalTicker" aria-live="polite" aria-atomic="true">
      <div class="goal-ticker-led"><span class="goal-ticker-led-dot"></span></div>
      <div class="goal-ticker-label">TODAY</div>
      <div class="goal-ticker-stage" id="goalTickerStage">
        <div class="goal-ticker-row">
          <span class="goal-ticker-status" data-status="">—</span>
          <span class="goal-ticker-text">Loading…</span>
        </div>
      </div>
      <div class="goal-ticker-meta" id="goalTickerMeta">0/0</div>
    </div>
  </div>

  <div class="day-ring-wrap">
    <div class="day-ring">
      <svg viewBox="0 0 120 120">
        <defs>
          <filter id="dayRingGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle class="day-ring-track" cx="60" cy="60" r="52" />
        <circle class="day-ring-fill"  cx="60" cy="60" r="52" id="dayRingFill" filter="url(#dayRingGlow)" />
      </svg>
      <div class="day-ring-overlay">
        <div class="day-ring-percent" id="dayRingPercent">—</div>
        <div class="day-ring-phase"   id="dayRingPhase">—</div>
        <div class="day-ring-clock"   id="dayRingClock">—</div>
      </div>
    </div>
    <div class="day-ring-text">
      <div class="day-ring-status"    id="dayRingStatus">Loading…</div>
      <div class="day-ring-remaining" id="dayRingRemaining">—</div>
      <div class="day-ring-hours">7:00 AM – 10:00 PM</div>
    </div>
  </div>

  <!-- The five automated quests, rendered by the same component the Hub
       uses so the two surfaces cannot drift apart. -->
  <div id="dailyQuests"></div>
  <!-- the War Room's Today's Quests, the same list as on planner.html -->
  <div id="plannerQuests"></div>

</div>

<script>
(function () {
  'use strict';

  const WAKE_HOUR  = 7;
  const SLEEP_HOUR = 22;

  function pad2(n) { return String(n).padStart(2, '0'); }

  // ---------- Ticker: what is still open on Today's Quests ----------
  // Read-only: the list is rolled in memory, never written from here.
  const tickerStage = document.getElementById('goalTickerStage');
  const tickerMeta  = document.getElementById('goalTickerMeta');
  let cycleIdx = 0;
  let tickerTimer = null;

  function buildTickerItems() {
    const PC = window.PlannerCore;
    const s = PC && PC.read();
    if (s) PC.roll(s);
    const v = s ? PC.view(s) : null;
    if (!v || !v.total) {
      return { items: [{ status: 'empty', text: 'Nothing picked for today — choose up to five in the War Room.' }], done: 0, total: 0 };
    }
    if (v.done === v.total) return { items: [{ status: 'done', text: '✓ Every quest kept — the streak holds.' }], done: v.done, total: v.total };
    const items = v.items.filter(it => !it.done).map(it => ({ status: 'pending', text: it.task.title }));
    if (!items.length) items.push({ status: 'pending', text: 'Heavier quests are waiting for a better-energy day.' });
    return { items, done: v.done, total: v.total };
  }

  function statusGlyph(status) {
    if (status === 'done') return '✓';
    if (status === 'pending') return '○';
    return '·';
  }

  // Single-row crossfade: keep one row in the DOM, fade it out, swap
  // its text, fade it back in. No overlap, no orphaned animation states.
  let firstTick = true;
  function tick() {
    const { items, done, total } = buildTickerItems();
    if (cycleIdx >= items.length) cycleIdx = 0;
    const item = items[cycleIdx];
    cycleIdx = (cycleIdx + 1) % items.length;
    tickerMeta.textContent = done + '/' + total;

    let row = tickerStage.querySelector('.goal-ticker-row');
    if (!row) {
      row = document.createElement('div');
      row.className = 'goal-ticker-row';
      row.innerHTML =
        '<span class="goal-ticker-status"></span>' +
        '<span class="goal-ticker-text"></span>';
      tickerStage.appendChild(row);
    }

    const statusEl = row.querySelector('.goal-ticker-status');
    const textEl   = row.querySelector('.goal-ticker-text');

    const apply = () => {
      statusEl.setAttribute('data-status', item.status);
      statusEl.textContent = statusGlyph(item.status);
      textEl.textContent = item.text;
      row.classList.remove('is-fading');
    };

    if (firstTick) { apply(); firstTick = false; return; }
    row.classList.add('is-fading');
    setTimeout(apply, 220);
  }

  function startTicker() {
    tick();
    if (tickerTimer) clearInterval(tickerTimer);
    tickerTimer = setInterval(tick, 5000);
  }

  function retick() { cycleIdx = 0; tick(); }
  window.addEventListener('quests-changed', retick);
  window.addEventListener('storage', (e) => { if (!e.key || e.key === 'planner:v1') retick(); });

  // ---------- Day Ring ----------
  const PALETTE = [
    [0,    [255, 216, 158]],
    [12.5, [255, 205, 121]],
    [25,   [255, 227, 143]],
    [37.5, [255, 183, 106]],
    [50,   [255, 149,  89]],
    [62.5, [243, 111,  79]],
    [75,   [226,  93, 122]],
    [87.5, [123,  91, 176]],
    [100,  [ 47,  58, 102]]
  ];
  function lerp(a, b, t) { return a + (b - a) * t; }
  function paletteAt(p) {
    if (p <= PALETTE[0][0]) return PALETTE[0][1];
    if (p >= PALETTE[PALETTE.length - 1][0]) return PALETTE[PALETTE.length - 1][1];
    for (let i = 0; i < PALETTE.length - 1; i++) {
      const [p0, c0] = PALETTE[i];
      const [p1, c1] = PALETTE[i + 1];
      if (p >= p0 && p <= p1) {
        const t = (p - p0) / (p1 - p0);
        return [lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t)];
      }
    }
    return [255,255,255];
  }
  function rgb(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }

  function formatClock(d) {
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    if (h === 0) h = 12;
    return h + ':' + pad2(m) + ' ' + ampm;
  }
  function formatRemaining(totalMin) {
    const h = Math.floor(totalMin / 60);
    const m = Math.floor(totalMin % 60);
    return h + 'h ' + m + 'm';
  }

  const C = 2 * Math.PI * 52;
  const fillEl = document.getElementById('dayRingFill');
  fillEl.setAttribute('stroke-dasharray', C);
  fillEl.setAttribute('stroke-dashoffset', C);

  function updateDayRing() {
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    const percentEl   = document.getElementById('dayRingPercent');
    const phaseEl     = document.getElementById('dayRingPhase');
    const clockEl     = document.getElementById('dayRingClock');
    const statusEl    = document.getElementById('dayRingStatus');
    const remainingEl = document.getElementById('dayRingRemaining');

    clockEl.textContent = formatClock(now);

    if (hours < WAKE_HOUR) {
      fillEl.setAttribute('stroke-dashoffset', C);
      fillEl.style.stroke = '#4D4B47';
      percentEl.textContent = '—';
      phaseEl.textContent   = 'SLEEPING';
      statusEl.textContent  = '😴 Still sleeping';
      const minsUntil = (WAKE_HOUR - hours) * 60;
      remainingEl.textContent = formatRemaining(minsUntil) + ' until wake-up';
      return;
    }

    if (hours >= SLEEP_HOUR) {
      fillEl.setAttribute('stroke-dashoffset', 0);
      fillEl.style.stroke = '#E25D7A';
      percentEl.textContent = '100%';
      phaseEl.textContent   = 'PAST BEDTIME';
      statusEl.textContent  = '⚠️ Past bedtime';
      remainingEl.textContent = 'Sleep!';
      return;
    }

    const span = SLEEP_HOUR - WAKE_HOUR;
    const percent = (hours - WAKE_HOUR) / span * 100;
    fillEl.setAttribute('stroke-dashoffset', C * (1 - percent / 100));
    fillEl.style.stroke = rgb(paletteAt(percent));
    percentEl.textContent = Math.floor(percent) + '%';

    let phase, status;
    if (percent < 25)      { phase = 'MORNING';   status = '☀️ Morning — fresh start'; }
    else if (percent < 50) { phase = 'MIDDAY';    status = '⚡ Midday — keep moving'; }
    else if (percent < 75) { phase = 'AFTERNOON'; status = '🔥 Afternoon — push it'; }
    else if (percent < 90) { phase = 'EVENING';   status = '⏳ Evening — wrap up'; }
    else                   { phase = 'BEDTIME';   status = '🌙 Bedtime soon'; }
    phaseEl.textContent  = phase;
    statusEl.textContent = status;

    const minsLeft = (SLEEP_HOUR - hours) * 60;
    remainingEl.textContent = formatRemaining(minsLeft) + ' awake time left';
  }

  // ---------- Boot ----------
  updateDayRing();
  setInterval(updateDayRing, 60 * 1000);
  startTicker();
})();
</script>

<!-- The five automated quests, using the same component as the Hub. -->
<script>
(function () {
  'use strict';
  if (!window.QuestUI) return;
  var GS = window.GameState;
  // Completing a quest moves XP and the streak, which the pill, the
  // ticker and the HUD read.
  function moved() {
    if (GS) GS.reconcile();
    window.dispatchEvent(new CustomEvent('quests-changed'));
  }
  var daily = window.QuestUI.mountDaily('dailyQuests', { onChange: moved });
  var plan = window.QuestUI.mountPlanner('plannerQuests', { onChange: moved });

  // Both lists write synced rows: the game state and the War Room's own.
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof initCloudSync !== 'function' || !GS) return;
    initCloudSync({
      appKey: 'icis',
      syncedKeys: [GS.KEY],
      onApplied: function () {
        if (GS.onRemoteApplied() === 'adopted') { if (daily) daily.redraw(); if (plan) plan.redraw(); }
      }
    });
    initCloudSync({
      appKey: 'planner',
      syncedKeys: ['planner:v1'],
      onApplied: function () { moved(); if (plan) plan.redraw(); }
    });
  });
})();
</script>

<!-- The shared streak: a day counts when every Today's Quest is kept. -->
<script>
(function () {
  'use strict';
  var GS = window.GameState;
  if (!GS) return;
  var el = document.getElementById('gmStreakNum');
  var pill = document.getElementById('gmStreak');
  if (!el || !pill) return;

  function sync() {
    var st = GS.streakInfo();
    if (el.textContent !== String(st.count)) el.textContent = st.count;
    pill.classList.toggle('gm-streak-active', st.count > 0);
    pill.title = st.shields + ' of ' + st.maxShields + ' streak shields held' +
      (st.spent.length ? ' · ' + st.spent.length + ' day(s) currently shielded' : '');
  }
  sync();
  window.addEventListener('quests-changed', sync);
  document.addEventListener('icis:update', sync);
})();
</script>
</body>
</html>
